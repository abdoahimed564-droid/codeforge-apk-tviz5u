name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - run: gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "App ${{ github.run_number }}" --notes "Built by CodeForge"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
