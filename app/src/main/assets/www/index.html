<!DOCTYPE html>
<html lang="ar">
<head><style>body{
  font-family: system-ui, sans-serif;
  margin:0;
  padding:0;
  background:#f0f4f8;
  color:#333;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
#app{
  text-align:center;
}
#context-menu{
  position:absolute;
  background:#fff;
  border:1px solid #ccc;
  border-radius:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  z-index:1000;
}
#context-menu ul{
  list-style:none;
  margin:0;
  padding:0;
}
#context-menu li{
  padding:8px 12px;
  cursor:pointer;
}
#context-menu li:hover{
  background:#f0f0f0;
}
.hidden{
  display:none;
}</style>
<meta charset="UTF-8">
<title>Snake Game Builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <h1>Snake Game Builder</h1>
  <p>Right‑click anywhere on the page to see options.</p>
</div>

<div id="context-menu" class="hidden">
  <ul>
    <li data-action="create">Create Snake Game</li>
    <li data-action="add-enemy">Add Enemy</li>
    <li data-action="settings">Game Settings</li>
    <li data-action="help">Help & Docs</li>
  </ul>
</div>

<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const menu = document.getElementById('context-menu');
  if (!menu) return; // Guard against missing element

  document.addEventListener('contextmenu', e => {
    e.preventDefault();
    menu.style.top = `${e.clientY}px`;
    menu.style.left = `${e.clientX}px`;
    menu.classList.remove('hidden');
  });

  document.addEventListener('click', () => {
    menu.classList.add('hidden');
  });

  menu.addEventListener('click', e => {
    const action = e.target.dataset.action;
    if (!action) return;
    switch(action){
      case 'create':
        alert('Creating snake game… (placeholder)');
        break;
      case 'add-enemy':
        alert('Adding enemy… (placeholder)');
        break;
      case 'settings':
        alert('Open settings… (placeholder)');
        break;
      case 'help':
        alert('Open help & docs… (placeholder)');
        break;
    }
  });
});
</script></body>
</html>
